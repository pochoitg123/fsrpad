name: Cabecera web FSRpad v9
on:
  pull_request:
    branches: [main]
    paths: ['tools/exportar_web_v9.py', 'tools/preparar_obs_v9.py', '.github/workflows/obs-header.yml']
permissions:
  contents: read
jobs:
  header:
    if: github.head_ref == 'fsrpad-obs-v9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/exportar_web_v9.py
      - uses: actions/upload-artifact@v4
        with:
          name: FSRpad_v9_web_pages
          path: web_pages.h
